experiment:
  name: mlc_baseline

project:
  config_path: configs/projects/bmra_student_project.yaml

data:
  path: data/preprocessed/dataset.parquet

model:
  hidden_dims: [128, 128, 64]
  activation: relu
  dropout: 0.2
  use_missingness_mask: true

training:
  epochs: 300
  early_stopping_patience: 10
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  optimizer: adam

loss:
  type: masked_bce
  pos_weight: null

split:
  train: 0.7
  val: 0.15
  test: 0.15
  seed: 42

hash_params:
  - model.hidden_dims
  - model.activation
  - model.dropout
  - model.use_missingness_mask
  - training.learning_rate
  - training.weight_decay
  - training.optimizer
  - training.early_stopping_patience
  - loss.type
  - loss.pos_weight
  - split.seed
  - project.features
  - project.labels
